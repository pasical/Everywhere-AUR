name: Mirror Linux release and update AUR

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Published upstream tag, including v
        required: true
        type: string
      publish_aur:
        description: Build and push everywhere-bin after mirroring
        type: boolean
        default: true

permissions:
  contents: read

# Deduplicate a tag without dropping intermediate releases from other tags.
concurrency:
  group: everywhere-aur-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  mirror:
    outputs:
      ready: ${{ steps.mirror.outputs.ready }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - name: Mirror requested release
        id: mirror
        env:
          GH_TOKEN: ${{ github.token }}
          UPSTREAM_REPOSITORY: ${{ vars.UPSTREAM_REPOSITORY || 'pasical/Everywhere' }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: python3 scripts/sync_release.py --tag "$RELEASE_TAG"
      - uses: actions/upload-artifact@v4
        if: ${{ steps.mirror.outputs.ready == 'true' }}
        with:
          name: aur-recipe
          path: out/
          if-no-files-found: error

  package:
    needs: mirror
    if: ${{ needs.mirror.outputs.ready == 'true' }}
    permissions:
      contents: write
    uses: ./.github/workflows/publish-recipe.yml
    with:
      tag: ${{ inputs.tag }}
      publish_aur: ${{ inputs.publish_aur }}
    secrets:
      AUR_SSH_PRIVATE_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
